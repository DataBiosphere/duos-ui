on: [pull_request]
name: Vitest tests
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  vitest-run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: echo "NODE_VERSION=$(sed -n 's/FROM node:\([0-9.]*\).*/\1/p' Dockerfile)" >> $GITHUB_ENV
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.1.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm ci
      - name: Run Vitest (root)
        run: pnpm run test:coverage
      - name: Run Vitest (server)
        run: pnpm -C server run test:coverage
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps
      - name: Run Vitest browser tests
        run: pnpm run test:browser
      - name: Merge coverage reports
        run: node scripts/merge-coverage.mjs
      - name: Publish coverage report to PR
        if: success()
        uses: davelosert/vitest-coverage-report-action@8b157684c6a6b259b97d45e72b44242865c0f6a5 # v2.12.2
        with:
          name: DUOS Coverage Report
          json-summary-path: coverage/coverage-summary.json
          json-final-path: coverage/coverage-final.json
