on: [pull_request]
name: Playwright integration tests
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DUOS_DB_HOST: localhost
  DUOS_DB_PORT: '5432'
  DUOS_DB_NAME: consent
  DUOS_DB_USER: consent
  # Ephemeral CI database credential.
  DUOS_DB_PASSWORD: consent
  # The local Postgres service does not support TLS.
  DUOS_DB_SSL: 'false'
  DUOS_API_URL: https://consent.dsde-dev.broadinstitute.org
  # `pnpm run serve` defaults this off to spare a developer's browser; CI has none.
  DUOS_HSTS: 'true'

jobs:
  playwright-run:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    services:
      postgres:
        image: postgres:16.13-alpine
        env:
          POSTGRES_DB: consent
          POSTGRES_USER: consent
          POSTGRES_PASSWORD: consent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U consent -d consent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: echo "NODE_VERSION=$(sed -n 's/FROM node:\([0-9.]*\).*/\1/p' Dockerfile)" >> $GITHUB_ENV
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.1.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm ci
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps
      # Keep legacy auth until 6-D-pre (DT-4068) adds the BFF sign-in fixture.
      - name: Copy Configs
        run: cp config/dev.json public/config.json
      - name: Map local dev hostname
        run: echo "127.0.0.1 local.dsde-dev.broadinstitute.org" | sudo tee -a /etc/hosts
      # Secure session cookies require HTTPS; Playwright accepts this self-signed certificate.
      - name: Generate a TLS certificate for the server
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout server.key -out server.crt \
            -subj "/CN=local.dsde-dev.broadinstitute.org" \
            -addext "subjectAltName=DNS:local.dsde-dev.broadinstitute.org,DNS:localhost,IP:127.0.0.1"
      # Session secrets must contain at least 32 characters. Masked because this repository is public.
      - name: Generate a session secret
        run: |
          SECRET=$(openssl rand -base64 48)
          echo "::add-mask::$SECRET"
          echo "DUOS_SESSION_SECRET=$SECRET" >> $GITHUB_ENV
      # The session store requires this table before its first write.
      - name: Apply the session schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f test/e2e/sql/user_sessions.sql
        env:
          DATABASE_URL: postgresql://consent:consent@localhost:5432/consent
      - name: Build app
        run: CI=false pnpm run build
      - name: Run Playwright integration tests
        run: pnpm run test:e2e
        env:
          DUOS_AUTOMATION_ADMIN_SA: ${{ secrets.DUOS_AUTOMATION_ADMIN_SA }}
          DUOS_AUTOMATION_CHAIR_SA: ${{ secrets.DUOS_AUTOMATION_CHAIR_SA }}
          DUOS_AUTOMATION_MEMBER_SA: ${{ secrets.DUOS_AUTOMATION_MEMBER_SA }}
          DUOS_AUTOMATION_RESEARCHER_SA: ${{ secrets.DUOS_AUTOMATION_RESEARCHER_SA }}
          DUOS_AUTOMATION_SIGNING_OFFICIAL_SA: ${{ secrets.DUOS_AUTOMATION_SIGNING_OFFICIAL_SA }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
