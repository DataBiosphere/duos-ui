on: [pull_request]
name: npm audit
jobs:
  scan:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
      - name: install dependencies
        run: npm ci
      - name: npm audit
        run: npm audit --omit=dev
