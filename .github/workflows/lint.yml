on: [pull_request]
name: Lint Changed Files
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Extract Node.js version
        run: echo "NODE_VERSION=$(sed -n 's/FROM node:\([0-9.]*\).*/\1/p' Dockerfile)" >> $GITHUB_ENV
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm ci
      - name: Identify changed files
        run: |
          CHANGED_FILES=$(git diff "origin/$DESTINATION_REF" --diff-filter=d --name-only)
          echo "CHANGED_FILES=${CHANGED_FILES}" >> $GITHUB_ENV
        env:
          DESTINATION_REF: ${{ github.event.pull_request.base.ref }}
      - name: Lint changed files
        run: npx eslint ${CHANGED_FILES}
        env:
          CHANGED_FILES: ${{ env.CHANGED_FILES }}
      - name: TypeScript check
        run: |
          echo "$CHANGED_FILES" | node scripts/parse-tsc-output.js
        env:
          CHANGED_FILES: ${{ env.CHANGED_FILES }}
