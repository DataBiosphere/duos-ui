version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    target-branch: develop
    commit-message:
      prefix: "[DT-400-actions]"
    groups:
      action-major:
        patterns:
          - "*"
        update-types:
          - "major"
      action-minor-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    target-branch: develop
    labels:
      - "dependency"
      - "pnpm"
    commit-message:
      prefix: "[DT-400-pnpm]"
    groups:
      pnpm-major:
        patterns:
          - "*"
        update-types:
          - "major"
      pnpm-minor-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    target-branch: develop
    labels:
      - "dependency"
      - "docker"
    commit-message:
      prefix: "[DT-400-docker]"
    groups:
      docker-major:
        patterns:
          - "*"
        update-types:
          - "major"
      docker-minor-patch:
        update-types:
          - "minor"
          - "patch"
