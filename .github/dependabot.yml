version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    target-branch: develop
    commit-message:
      prefix: "[DT-400-actions]"
    groups:
      action-major:
        patterns:
          - "*"
        update-types:
          - "major"
      action-minor-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    target-branch: develop
    labels:
      - "dependency"
      - "pnpm"
    commit-message:
      prefix: "[DT-400-pnpm]"
    ignore:
      # Held at 11.1.5 until DT-4420 migrates the session store. 11.1.6 fixes
      # GHSA-2hw7-jxfh-4rm3 (logout race), but it won't register without a store
      # compareAndSet, and regenerate() now keeps the store row, which breaks the
      # sign-in rotation. Capped below 12 so a major release still opens a PR.
      - dependency-name: "@fastify/session"
        versions: [">=11.1.6 <12"]
    groups:
      pnpm-major:
        patterns:
          - "*"
        update-types:
          - "major"
      pnpm-minor-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    target-branch: develop
    labels:
      - "dependency"
      - "docker"
    commit-message:
      prefix: "[DT-400-docker]"
    groups:
      docker-major:
        patterns:
          - "*"
        update-types:
          - "major"
      docker-minor-patch:
        update-types:
          - "minor"
          - "patch"
