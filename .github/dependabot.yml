version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    target-branch: develop
    commit-message:
      prefix: "[DT-400-actions]"
    groups:
      action-dependencies:
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
      action-patch-updates:
        update-types:
          - "patch"
        schedule:
          interval: cron
          cronjob: "0 0 1,15 * *"
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    target-branch: develop
    labels:
      - "dependency"
      - "npm"
    commit-message:
      prefix: "[DT-400-npm]"
    groups:
      npm-dependencies:
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
      npm-patch-updates:
        update-types:
          - "patch"
        schedule:
          interval: cron
          cronjob: "0 0 1,15 * *"
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    target-branch: develop
    labels:
      - "dependency"
      - "docker"
    commit-message:
      prefix: "[DT-400-docker]"
    groups:
      docker-dependencies:
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
      docker-patch-updates:
        update-types:
          - "patch"
        schedule:
          interval: cron
          cronjob: "0 0 1,15 * *"
