# This is an example compose file that can be used for local development.
# Modify the config file in `volumes` to point to the desired environment, default id dev.
# Ensure that the following configuration files have been created in the correct locations:
#   * public/config.json
#   * ca-bundle.crt
#   * server.crt
#   * server.key
#   * site.conf
# Ensure that /etc/hosts contains an entry for:
# 	127.0.0.1	local.broadinstitute.org
# Ensure that `public/config.json` is pointing to the correct env (not local), i.e.:
#   ... "env": "dev", ...
# Build:
#   docker build . -t duos
# Run (standard):
#   docker compose up -d
# Run with local AI (Ollama + Gemma):
#   docker compose --profile local-ai up -d
#   docker exec duos-ollama ollama pull gemma3:4b
# Test
#   https://local.broadinstitute.org/
version: '3.8'
services:
  app:
    image: duos:latest
    container_name: duos
    ports:
      - 8080:8080
    volumes:
      - ./public/config.json:/usr/src/app/build/config.json
    environment:
      # When running with --profile local-ai, point the proxy at Ollama instead
      # of Vertex AI. Remove or leave blank to use real Vertex AI.
      OLLAMA_URL: http://ollama:11434
    command: ["node", "server/src/index.js"]
    restart: always

  # ---------------------------------------------------------------------------
  # Local AI — Ollama running Google's Gemma 3 4B model.
  #
  # Gemma is the open-weight model family that underlies Gemini. Running it
  # locally via Ollama lets you exercise the full chat → proxy → MCP flow
  # without hitting Vertex AI or incurring API costs.
  #
  # Ollama exposes an OpenAI-compatible API on port 11434. The DUOS proxy
  # detects the OLLAMA_URL env var and routes requests through Ollama instead
  # of the Vertex AI SDK when it is set.
  #
  # First-time setup (after `docker compose --profile local-ai up -d`):
  #   docker exec duos-ollama ollama pull gemma3:4b
  #
  # Gemma 3 4B requires ~4 GB RAM. For a lighter footprint use gemma3:1b (~1 GB).
  # For higher fidelity use gemma3:12b if your machine has >= 16 GB available.
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: duos-ollama
    ports:
      - 11434:11434
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - local-ai
    restart: always

  proxy:
    image: us.gcr.io/broad-dsp-gcr-public/httpd-terra-proxy:v0.1.16
    container_name: duos-proxy
    hostname: local.dsde-dev.broadinstitute.org
    links:
      - app:app
    ports:
      - 80:8080
      - 443:443
    volumes:
      - ./ca-bundle.crt:/etc/ssl/certs/server-ca-bundle.crt:ro
      - ./server.crt:/etc/ssl/certs/server.crt:ro
      - ./server.key:/etc/ssl/private/server.key:ro
      - ./site.conf:/etc/httpd/conf.d/site.conf:ro
    environment:
      AUTH_TYPE: AuthType None
      LOG_LEVEL: warn
      OIDC_CLAIM: Require all granted
      PROXY_PATH: /
      PROXY_URL: http://app:8080/
      SERVER_NAME: local.dsde-dev.broadinstitute.org
      SERVER_NAME_INT: local.dsde-dev.broadinstitute.org
      ENABLE_TCELL: 'no'
    restart: always

volumes:
  ollama_data:
