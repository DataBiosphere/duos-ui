packages:
  - server

overrides:
  # @fastify/static@10 asks for glob ^13, which is flagged by GHSA-3g3m-2fjr-6pw4
  # and pulls minimatch@10 (GHSA-g3hv-75wg-m249). glob 14 fixes both, and the
  # glob() options that @fastify/static uses are unchanged. Remove this once
  # @fastify/static asks for glob ^14.
  "@fastify/static>glob": 14.0.3

allowBuilds:
  esbuild: false
allowedDeprecatedVersions:
  node-domexception: "1.0.0"
trustPolicy: no-downgrade
