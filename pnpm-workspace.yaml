packages:
  - server

overrides:
  # autocannon@8 asks for hyperid ^3, whose uuid@8 dependency is flagged by
  # GHSA-w5hq-g745-h8pq. hyperid 4 drops uuid (and uuid-parse) for the native
  # crypto.randomUUID; its API is unchanged, so it is a drop-in for autocannon.
  hyperid@3: 4.0.0

allowBuilds:
  esbuild: false
allowedDeprecatedVersions:
  node-domexception: "1.0.0"
trust-policy: no-downgrade
